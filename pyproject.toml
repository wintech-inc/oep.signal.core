[project]
name = "signal-core"
version = "0.1.0"
description = "SIGNAL: market intelligence for OEP (WinTech, Pocahontas Aluminum)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic",
    "python-dotenv",
    "selectolax",
]

[project.scripts]
signal = "signal_core.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_core"]
